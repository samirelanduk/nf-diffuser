name: noise_schedule
description: Creates the sequence of noise levels a sampler steps through, from the noisiest level down to a clean image.
keywords:
  - pydiffuse
  - noise
  - schedule
  - diffusion
tools:
  - pydiffuse:
      description: |
        Python library and command-line tool for generating media with
        diffusion.
      homepage: https://github.com/samirelanduk/pydiffuse
      documentation: https://github.com/samirelanduk/pydiffuse/blob/master/README.md
      licence: ["MIT"]
      args_id: ""
  - python:
      description: Python runtime used to execute the pydiffuse CLI.
      homepage: https://www.python.org/
      documentation: https://docs.python.org/
      licence: ["Python-2.0"]
      identifier: biotools:python
      args_id: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ].
    - steps:
        type: integer
        description: Number of steps the sampler will take.
output:
  schedule:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ].
      - "${meta.id}_schedule.txt":
          type: file
          description: |
            One noise level per line, rounded to eight decimal places. There is
            one more line than there are steps, because the schedule ends at 0.
          pattern: "*_schedule.txt"

  versions_python:
    - - "${task.process}":
          type: string
          description: Name of the Nextflow process that emitted the version.
      - python:
          type: string
          description: Tool name associated with the emitted version value.
      - 'python3 --version | cut -d" " -f2':
          type: eval
          description: Reported version string for the tool.

  versions_pydiffuse:
    - - "${task.process}":
          type: string
          description: Name of the Nextflow process that emitted the version.
      - pydiffuse:
          type: string
          description: Tool name associated with the emitted version value.
      - 'python3 -c "import pydiffuse; print(pydiffuse.__version__)"':
          type: eval
          description: Reported version string for the tool.

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - python:
          type: string
          description: The tool name
      - 'python3 --version | cut -d" " -f2':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - pydiffuse:
          type: string
          description: The tool name
      - 'python3 -c "import pydiffuse; print(pydiffuse.__version__)"':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@samirelanduk"
maintainers:
  - "@samirelanduk"
