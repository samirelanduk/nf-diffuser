report_comment: >
  This report has been generated by the <a href="https://github.com/samirelanduk/nf-diffuser/tree/dev" target="_blank">samirelanduk/nf-diffuser</a>
  analysis pipeline.
report_section_order:
  imageqc:
    order: 1000
  "samirelanduk-nf-diffuser-methods-description":
    order: -1000
  software_versions:
    order: -1001
  "samirelanduk-nf-diffuser-summary":
    order: -1002

export_plots: true

disable_version_detection: true

custom_data:
  imageqc_gallery:
    parent_id: &parent_id imageqc
    parent_name: &parent_name "Image QC"
    parent_description: &parent_description "Quality and prompt adherence of each generated image."
    section_name: "Gallery"
    description: "Every generated image with its prompt, negative prompt and settings."
    plot_type: html

  imageqc_stats:
    parent_id: *parent_id
    parent_name: *parent_name
    parent_description: *parent_description
    section_name: "Image statistics"
    description: "Basic statistics of each image's pixels. Switch to the table view for exact values."
    plot_type: violin
    pconfig:
      id: imageqc_stats_plot
      title: "Image QC: image statistics"
    headers: &imageqc_stats_headers
      brightness:
        title: "Brightness"
        description: "Mean luminance (0-255)"
        min: 0
        max: 255
        scale: "Blues"
        format: "{:,.1f}"
        placement: 100
      contrast:
        title: "Contrast"
        description: "Standard deviation of luminance. Below 2 means a blank image."
        min: 0
        scale: "Blues"
        format: "{:,.1f}"
        placement: 110
        cond_formatting_rules:
          fail: [{ lt: 2 }]
        cond_formatting_colours:
          - fail: "#d9534f"
      shadow_clipping:
        title: "Shadow clip"
        description: "Percentage of pixels that are pure black. Over 25% is flagged."
        min: 0
        max: 100
        suffix: "%"
        scale: "OrRd"
        format: "{:,.1f}"
        placement: 120
        cond_formatting_rules:
          warn: [{ gt: 25 }]
        cond_formatting_colours:
          - warn: "#f0ad4e"
      highlight_clipping:
        title: "Highlight clip"
        description: "Percentage of pixels that are pure white. Over 25% is flagged."
        min: 0
        max: 100
        suffix: "%"
        scale: "OrRd"
        format: "{:,.1f}"
        placement: 130
        cond_formatting_rules:
          warn: [{ gt: 25 }]
        cond_formatting_colours:
          - warn: "#f0ad4e"
      sharpness:
        title: "Sharpness"
        description: "Variance of the Laplacian of luminance. Low values mean a blurry image, but smooth subjects also score low."
        min: 0
        scale: "Blues"
        format: "{:,.0f}"
        placement: 140
      noise:
        title: "Noise"
        description: "Standard deviation of Gaussian noise, estimated with Immerkaer's method"
        min: 0
        scale: "Blues"
        format: "{:,.2f}"
        placement: 150
      colourfulness:
        title: "Colourfulness"
        description: "Hasler and Suesstrunk colourfulness. Below ~15 is close to greyscale."
        min: 0
        scale: "Blues"
        format: "{:,.1f}"
        placement: 160
      entropy:
        title: "Entropy"
        description: "Shannon entropy of the luminance histogram, in bits (0-8)"
        min: 0
        max: 8
        scale: "Blues"
        format: "{:,.2f}"
        placement: 170

  imageqc_stats_general:
    plot_type: generalstats
    namespace: "Image statistics"
    headers: *imageqc_stats_headers

  imageqc_clipscore:
    parent_id: *parent_id
    parent_name: *parent_name
    parent_description: *parent_description
    section_name: "CLIPScore"
    description: >
      100 × cosine similarity between the CLIP ViT-L/14 embeddings of the image and its prompt
      (<a href="https://doi.org/10.18653/v1/2021.emnlp-main.595">Hessel et al. 2021</a>),
      and of the image and its negative prompt.
    plot_type: violin
    pconfig:
      id: imageqc_clipscore_plot
      title: "Image QC: CLIPScore"
    headers: &imageqc_clipscore_headers
      clipscore:
        title: "CLIPScore"
        description: "CLIPScore between the image and its prompt. Higher means better prompt adherence."
        min: 0
        max: 100
        scale: "RdYlGn"
        format: "{:,.1f}"
        placement: 200
      clipscore_negative:
        title: "CLIPScore (negative)"
        description: "CLIPScore between the image and its negative prompt. Lower is better."
        min: 0
        max: 100
        scale: "RdYlGn-rev"
        format: "{:,.1f}"
        placement: 210

  imageqc_clipscore_general:
    plot_type: generalstats
    namespace: "CLIPScore"
    headers: *imageqc_clipscore_headers

  imageqc_pickscore:
    parent_id: *parent_id
    parent_name: *parent_name
    parent_description: *parent_description
    section_name: "PickScore"
    description: >
      Similarity between the image and its prompt, from a CLIP model fine-tuned on human preferences between generated images
      (<a href="https://doi.org/10.48550/arXiv.2305.01569">Kirstain et al. 2023</a>), and between the image and its negative prompt.
    plot_type: violin
    pconfig:
      id: imageqc_pickscore_plot
      title: "Image QC: PickScore"
    headers: &imageqc_pickscore_headers
      pickscore:
        title: "PickScore"
        description: "PickScore between the image and its prompt. Higher means better prompt adherence and appeal."
        scale: "RdYlGn"
        format: "{:,.1f}"
        placement: 300
      pickscore_negative:
        title: "PickScore (negative)"
        description: "PickScore between the image and its negative prompt. Lower is better."
        scale: "RdYlGn-rev"
        format: "{:,.1f}"
        placement: 310

  imageqc_pickscore_general:
    plot_type: generalstats
    namespace: "PickScore"
    headers: *imageqc_pickscore_headers

sp:
  imageqc_gallery:
    fn: "imageqc_gallery.html"
  imageqc_stats:
    fn: "*_imageqc_stats.tsv"
    shared: true
  imageqc_stats_general:
    fn: "*_imageqc_stats.tsv"
    shared: true
  imageqc_clipscore:
    fn: "*_clipscore.tsv"
    shared: true
  imageqc_clipscore_general:
    fn: "*_clipscore.tsv"
    shared: true
  imageqc_pickscore:
    fn: "*_pickscore.tsv"
    shared: true
  imageqc_pickscore_general:
    fn: "*_pickscore.tsv"
    shared: true

custom_content:
  order:
    - imageqc_gallery
    - imageqc_stats
    - imageqc_clipscore
    - imageqc_pickscore
